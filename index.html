<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CritiCall-style five-minute transcription test with selectable difficulty and header practice.">
<title>CritiCall Typing Practice</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" data-state="idle">

  <header class="console">
    <div class="console-top">
      <div class="console-id">
        <div class="mark" aria-hidden="true">TX</div>
        <div>
          <h1>CritiCall Typing Practice</h1>
          <div class="status-line">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status" aria-live="polite">Choose Start when ready.</span>
          </div>
        </div>
      </div>
      <div class="console-links">
        <a id="historyLink" class="btn-link" href="history.html" title="View saved practice history">History</a>
        <button id="timerToggle" aria-pressed="true" title="Show or hide the countdown while typing">Timer: Shown</button>
      </div>
    </div>

    <div class="controls">
      <div class="mode-switch" role="group" aria-label="Practice mode">
        <button id="testMode" class="mode active">5-Minute Test</button>
        <button id="headerMode" class="mode">Header Practice</button>
      </div>
      <div class="mode-switch level-switch" role="group" aria-label="Difficulty">
        <button class="level" data-level="1" title="Plain prose with a short opening line">Easy</button>
        <button class="level" data-level="2" title="Dated headers, sign-offs, more names and numbers">Moderate</button>
        <button class="level" data-level="3" title="Letterheads, file numbers, Re: lines, dense details">Hard</button>
        <button class="level" data-level="4" title="Full business headers, codes, extensions, unusual names">Expert</button>
        <button class="level" data-level="mixed" title="A random difficulty each passage">Mixed</button>
      </div>
      <span class="timer" id="timer">05:00</span>
      <button id="newLetter">New Passage</button>
      <button class="primary" id="start" title="Start (Ctrl/Cmd + Enter) · Stop ends the run early">Start</button>
    </div>
  </header>

  <div class="info-strip" id="infoStrip">
    <span class="badge" id="levelBadge">Easy</span>
    <span class="badge subtle" id="kindBadge">Letter</span>
    <span id="infoText">Five minutes · pass at 40 WPM and 95% accuracy</span>
  </div>

  <div class="test-grid">
    <section class="panel source">
      <div class="panel-header"><span id="sourceHeader">Source Passage</span></div>
      <div class="letter" id="sourceLetter"></div>
    </section>
    <section class="panel entry">
      <div class="panel-header"><span>Transcription</span></div>
      <textarea id="entry" disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Transcription input" placeholder="Your typed transcription will appear here once the run starts."></textarea>
    </section>
  </div>

  <section class="results" id="results" aria-live="polite">
    <div class="results-head">
      <div class="verdict">
        <span class="verdict-badge" id="passFail">—</span>
        <span class="verdict-margin" id="margin">—</span>
      </div>
      <div class="results-actions">
        <button id="reviewErrors">Review errors</button>
        <button id="copyResults">Copy summary</button>
      </div>
    </div>

    <div class="result-grid headline-row">
      <div class="metric headline"><div class="label">Gross WPM</div><div class="value" id="grossWpm">0</div></div>
      <div class="metric headline"><div class="label">Accuracy</div><div class="value" id="accuracy">0%</div></div>
    </div>
    <div class="result-grid secondary">
      <div class="metric"><div class="label">Characters Typed</div><div class="value" id="charsTyped">0</div></div>
      <div class="metric"><div class="label">Run Length</div><div class="value" id="runLength">—</div></div>
      <div class="metric"><div class="label">Correct-like Chars</div><div class="value" id="correctChars">0</div></div>
      <div class="metric"><div class="label">Errors</div><div class="value" id="errors">0</div></div>
    </div>

    <div class="note" id="resultNote"></div>
    <div class="error-review" id="errorReview" hidden></div>
  </section>

</div>
<script src="scenarios.js"></script>
<script src="generator.js"></script>
<script src="app.js"></script>
</body>
</html>
